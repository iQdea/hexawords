name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: hexawords_test
          POSTGRES_USER: hexawords
          POSTGRES_PASSWORD: hexawords_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    env:
      DATABASE_URL: postgresql://hexawords:hexawords_test@localhost:5432/hexawords_test
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      JWT_SECRET: ci-test-secret
      JWT_REFRESH_SECRET: ci-test-refresh-secret

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm turbo build --filter='./packages/*'

      - name: Run unit tests
        run: pnpm turbo test --filter='./packages/*'

      - name: Create database schema
        run: PGPASSWORD=hexawords_test psql -h localhost -U hexawords -d hexawords_test -f apps/api/src/seed/init.sql

      - name: Seed dictionary
        run: cd apps/api && npx ts-node src/seed/seed.ts

      - name: Build API
        run: cd apps/api && npx nest build

      - name: Run API e2e tests
        run: cd apps/api && npx jest --config ./test/jest-e2e.json --forceExit --detectOpenHandles

      - name: Build web
        run: pnpm --filter @hexawords/web build

  docker:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    steps:
      - uses: actions/checkout@v4

      - name: Build API Docker image
        run: docker build -f Dockerfile.api -t hexawords-api .

      - name: Build Web Docker image
        run: docker build -f Dockerfile.web -t hexawords-web .
